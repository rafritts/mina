  <!-- sunburst rays from lower center -->
  <g stroke="#d4a574" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <path d="M16 22V5"/>
    <path d="M16 22L9 7"/>
    <path d="M16 22L23 7"/>
    <path d="M16 22L5.5 11"/>
    <path d="M16 22L26.5 11"/>
    <path d="M16 22L4 16"/>
    <path d="M16 22L28 16"/>
    <path d="M16 22L6 21"/>
    <path d="M16 22L26 21"/>
  </g>
  <!-- arc bands -->
  <path d="M6 22a10 10 0 0 1 20 0" stroke="#e8bc8a" stroke-width="1.15" opacity="0.7"/>
  <path d="M9 22a7 7 0 0 1 14 0" stroke="#d4a574" stroke-width="0.9" opacity="0.4"/>
